version: "3.8"
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /srv/data/fooddiary.db
      CORS_ORIGINS: ${CORS_ORIGINS:-https://fooddairy.duckdns.org}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - ./data:/srv/data
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro