server {
  listen 80;
  server_name fooddairy.duckdns.org;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name fooddairy.duckdns.org;
  ssl_certificate /etc/letsencrypt/live/fooddairy.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/fooddairy.duckdns.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  location = /index.html { add_header Cache-Control "no-store, no-cache, must-revalidate" always; }
  location / { add_header Cache-Control "no-store, no-cache, must-revalidate" always; try_files $uri $uri/ /index.html; }
}